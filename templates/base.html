{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Control de Stock{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'producto_list' %}">📦 Control de Stock</a>
        <nav>
            <a href="{% url 'producto_list' %}">Productos</a>
            <a href="{% url 'categoria_list' %}">Categorías</a>

            <!-- Menú Desplegable de Movimientos -->
            <div class="dropdown">
                <span class="dropdown-toggle">Movimientos ▾</span>
                <div class="dropdown-menu">
                    <a href="{% url 'movimiento_entrada' %}">+ Entrada</a>
                    <a href="{% url 'movimiento_salida' %}">- Salida</a>
                    <a href="{% url 'movimiento_ajuste' %}">⚙ Ajuste</a>
                    <a href="{% url 'movimiento_historial' %}">📋 Ver Historial</a>
                </div>
            </div>

            <a href="/admin/" target="_blank">Admin ↗</a>
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
